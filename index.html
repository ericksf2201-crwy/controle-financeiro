<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Controle Financeiro</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--shadow:0 4px 20px rgba(0,0,0,0.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#0f172a;color:#fff;padding:26px 20px 30px} .wrap{max-width:1100px;margin:auto}
header h1#main-header-title{margin:4px 0 5px;font-size:clamp(18px,3.5vw,24px);font-weight:600;color:#e2e8f0}
header p{margin:0;color:#94a3b8}
main{max-width:1100px;margin:-14px auto 40px;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:18px}.label{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}.amount{font-size:clamp(18px,3vw,26px);font-weight:750;letter-spacing:-.5px}.income{color:var(--green)}.expense{color:var(--red)}.balance{color:var(--blue)}
.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px;color:#0f172a;font-weight:700}.field{margin-bottom:13px}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px;color:#334155}input,select,button{font:inherit}input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--text)}input:focus,select:focus{outline:2px solid #93c5fd;border-color:var(--blue)}.type-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.type-switch button{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f1f5f9;color:var(--muted);cursor:pointer;font-weight:700}.type-switch button.active{background:#dbeafe;border-color:#bfdbfe;color:#1d4ed8}
.primary{border:0;background:var(--blue);color:white;font-weight:750;padding:12px 16px;border-radius:10px;cursor:pointer;width:100%}.primary:hover{background:#1d4ed8}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0}.toolbar-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input{width:auto;min-width:130px;padding:8px 10px;font-size:13px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700;background:#f8fafc}td strong{font-size:14px}.tag{display:inline-block;border-radius:99px;background:#f1f5f9;color:#334155;padding:4px 8px;font-size:12px;font-weight:500}.delete{border:0;background:#fee2e2;color:var(--red);border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700}.delete:hover{background:#fecaca}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.secondary{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:99px;cursor:pointer;color:var(--text);font-weight:600}.secondary:hover{background:#f8fafc}.notice{font-size:12px;color:var(--muted);margin-top:12px}

/* Painel Educador Financeiro */
.advisor-card{background:linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);border:1px solid #bfdbfe;border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;gap:14px;align-items:flex-start}
.advisor-icon{font-size:26px;line-height:1}
.advisor-content h3{margin:0 0 4px;font-size:15px;color:#1e3a8a;font-weight:700}
.advisor-content p{margin:0;font-size:13px;color:#334155;line-height:1.4}

@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.panel{padding:16px}}
@media(max-width:480px){.cards{gap:9px}.card{padding:13px}header{padding:20px 16px 24px}#auth-card{padding:24px 20px !important;}#user-greeting-container{flex-direction:column;align-items:flex-start!important;gap:10px;}#user-greeting-container button{width:100%;}.toolbar-filters{width:100%;flex-direction:column;align-items:stretch}.toolbar-filters select,.toolbar-filters input{width:100%}}
</style>
</head>
